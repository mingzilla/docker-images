services:
  ollama:
    image: ollama/ollama:0.33.2 # 0.33.1+ required: adds Qwen3.8 Flash Next support
    container_name: ollama-qwen3pt8_flash_next
    ports:
      - "30214:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_MODEL=qwen3.8-flash-next:125b-a6b-nvfp4
    volumes:
      - ollama_qwen3pt8_flash_next:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "ps"]   # image has no curl/wget
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  ollama_qwen3pt8_flash_next:
